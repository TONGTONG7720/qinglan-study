name: qinglang-ocr-e2e

services:
  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z@sha256:da0fe26595711d0fb93dd28e24552520f68897195f4a23f5a17ffa9924ec3fac
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: qinglang-e2e-root
      MINIO_ROOT_PASSWORD: qinglang-e2e-root-secret-8mQ2vN9xP4rL6cW3
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000
      MINIO_KMS_SECRET_KEY: qinglang-e2e-key:IyqsU3kMFloCNup4BsZtf/rmfHVcTgznO2F25CkEH1g=
      MINIO_KMS_AUTO_ENCRYPTION: "off"
    ports:
      - 127.0.0.1:19000:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z@sha256:d5bccfe71e95a34b25d626d86621930342553657e8776833b65ae0bc63cf4928
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 qinglang-e2e-root
        qinglang-e2e-root-secret-8mQ2vN9xP4rL6cW3 &&
        mc mb --ignore-existing local/qinglang-private-e2e &&
        mc version enable local/qinglang-private-e2e &&
        mc anonymous set none local/qinglang-private-e2e &&
        mc admin user add local qinglang-ocr-service
        qinglang-e2e-service-secret-7pL3cV9nR2xK8mQ4 &&
        mc admin policy create local qinglang-ocr-private /config/policy.json &&
        mc admin policy attach local qinglang-ocr-private --user qinglang-ocr-service
    volumes:
      - ./ops/object-storage/e2e-policy.json:/config/policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    ports:
      - 127.0.0.1:13310:3310
    volumes:
      - clamav_database:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=10"]
      interval: 10s
      timeout: 15s
      retries: 40
      start_period: 180s
    mem_limit: 3g

volumes:
  minio_data:
  clamav_database:
